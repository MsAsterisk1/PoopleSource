<!doctype html>
<html lang="en" style="background: #202020">
  <head>
    <script>
      // Randomly select a branch for the split test

      const adProvider = ["ezoic", "publift"][Math.trunc(Math.random() * 2)]

      if (!sessionStorage.getItem('adProvider')) {
        // If not set
        sessionStorage.setItem('adProvider', adProvider);
      }

      // Set up any header script tags required by the provider

      switch (adProvider) {
        case "ezoic":
          // Shouldn't need anything here if the react sdk does its job

          break;
        case "publift":

          const publiftScript0 = document.createElement("script");
          publiftScript0.src = "https://cdn.fuseplatform.net/publift/tags/2/4330/fuse.js";
          publiftScript0.async = true;

          const publiftScript1 = document.createElement("script");
          publiftScript1.innerHTML = "" +
                  "// Get an initialisation-safe reference to the Fuse Queue\n" +
                  "    const fusetag = window.fusetag || (window.fusetag = { que: [] });\n" +
                  "\n" +
                  "    fusetag.que.push(function() {\n" +
                  "      fusetag.pageInit({\n" +
                  "        blockingFuseIds: [\n" +
                  "          'vrec_lhs',\n" +
                  "          'vrec_rhs',\n" +
                  "          'mobile_leaderboard'\n" +
                  "        ],\n" +
                  "\n" +
                  "        pageTargets: []\n" +
                  "      });\n" +
                  "    });";

          document.head.appendChild(publiftScript0);
          document.head.appendChild(publiftScript1);

          break;
      }

    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SBM3PJ5HJN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SBM3PJ5HJN');

      gtag('event', 'experience_impression', {
        exp_variant_string: "Ad-Provider-Test-" + sessionStorage.getItem('adProvider'),
      });
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" href="/PoopleStroke.png">
<!--    <link rel="icon" type="image/svg+xml" href="/PoopleStroke.svg" />-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The game where you turn words into poop! New game every day. Can you find the shortest path?" />
    <title>Poople - The Official Daily Word Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
